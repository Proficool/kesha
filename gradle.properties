# --- JVM -------------------------------------------------------------------
# Сборка идёт на слабой машине/раннере: держим heap небольшим.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# --- Android ---------------------------------------------------------------
# Принципиально: НИКАКОГО AndroidX. Каждая библиотека — это мегабайты в APK.
android.useAndroidX=false
android.enableJetifier=false
android.nonTransitiveRClass=true

# Не генерировать то, чем приложение не пользуется.
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false

# --- Kotlin ----------------------------------------------------------------
kotlin.code.style=official
# Отключаем проверки null на входе/выходе функций — минус несколько десятков КБ кода.
kotlin.compiler.execution.strategy=in-process
